<!--blog area start-->
{% load i18n %}
<div class="blog_area">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="section_title title_style2">
                    <div class="title_content">
                        <h2><span>{% trans "Последние" %} </span> {% trans "посты в блоге" %}</h2>
                        <p>{% trans "Продукция Mazlay с самыми высокими скидками" %} </p>   
                    </div>                 
                </div>
                </div>
        </div>   
        <div class="row">
            <div class="blog_container blog_column4 owl-carousel">
                {% for post in posts %}
                <div class="col-lg-3">
                    <article class="single_blog">
                        <figure>
                            <div class="blog_thumb">
                                <a href="#"><img src="{{post.img.url}}" alt=""></a>
                            </div>
                            <figcaption class="blog_content">
                                <h4><a href="#">{{post.title}}</a></h4> 
                                <div class="post_meta">
                                    <p><a href="index.html#">eCommerce</a> / {{post.created_at}}</p>
                                </div> 
                                <div class="post_desc">
                                    <p>{{post.desc|truncatewords:8|safe}}</p>
                                </div>
                                <footer class="post_readmore">
                                    <a href="#">{% trans "Читать дальше" %}</a>
                                </footer>
                            </figcaption>
                        </figure>
                    </article>
                </div>
                {% endfor %}
            </div>
        </div>          
    </div>
</div>
<!--blog area end-->
